{% extends 'attendance/base.html' %}{% block content %}<h1>Mark Attendance</h1><section><form method="post">{% csrf_token %}{{ form.as_p }}<table><tr><th>Roll</th><th>Student</th><th>Status</th></tr>{% for s in students %}<tr><td>{{ s.roll_number }}</td><td>{{ s.user.get_full_name|default:s.user.username }}</td><td><label><input type="radio" name="status_{{ s.pk }}" value="P" checked> Present</label> <label><input type="radio" name="status_{{ s.pk }}" value="A"> Absent</label></td></tr>{% empty %}<tr><td colspan="3">No students.</td></tr>{% endfor %}</table><button class="primary">Save Attendance</button></form></section>{% endblock %}
